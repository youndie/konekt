org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

kotlin.code.style=official

# A default that is a snapshot on purpose: a build with no -PVERSION must not be able to produce
# something that looks like a release. The deployable version is passed in by CI.
VERSION=0.1.0-SNAPSHOT

# WHAT THE SHARED CONVENTIONS READ (`ru.workinprogress.sborka`, wrapped by build-logic).
#
# The coordinate belongs to the build rather than to each module: a group repeated per module is how
# six modules of another repository once got published under a group derived from a directory name.
sborka.group=io.konekt
sborka.repository=youndie/konekt

# One number, in the file a diff shows, instead of `jvmToolchain(n)` in every convention. The floor
# is the same number rather than a lower one because nothing here is published: a floor below the
# toolchain is a promise made to consumers, and this build has none — it produces a server image and
# an application.
sborka.jvmToolchain=25
sborka.jvmFloor=25

# OFF, and not as a debt. `explicitApi()` asks every public declaration to spell out its visibility
# and return type for the sake of a consumer compiling against it; nothing here is published, and the
# modules that look like libraries are libraries of this build alone. The conventions default it on
# because most of the portfolio does publish.
sborka.explicitApi=false

