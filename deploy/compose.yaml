# The stand: Postgres, the broker, and the server.
#
# One command, the same one locally and in CI. A stand only CI knows how to start is a stand nobody
# debugs, and the failures worth catching here are the ones that only appear between processes.

name: konekt

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: konekt
      POSTGRES_USER: konekt
      POSTGRES_PASSWORD: konekt
    healthcheck:
      # `pg_isready` asks the server a question. A TCP check would pass against a Postgres still
      # replaying its WAL, and the migration job would then fail against a database that is up and
      # not yet listening for work.
      test: ["CMD-SHELL", "pg_isready -U konekt -d konekt"]
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
      # `/var/lib/postgresql` and NOT `/var/lib/postgresql/data`, which is the pre-18 convention and
      # what this file first said. The 18 image places its cluster in a subdirectory of the former so
      # that `pg_upgrade --link` has both versions inside one mount; with the old path the upgrade
      # crosses a mount-point boundary and cannot link. The image says so itself, at the moment it
      # refuses to start on a volume laid out the other way — which is how this was found.
      - postgres-data:/var/lib/postgresql
    ports:
      # Overridable because 5432 is contested on any machine that has ever run Postgres, and the
      # stand should not be the thing that refuses to start.
      - "${POSTGRES_PORT:-55432}:5432"

  broker:
    image: ghcr.io/youndie/booblik:0.3.0
    # Published for amd64 only. Named explicitly so an arm64 host emulates it with a warning rather
    # than failing with "no matching manifest", which reads like a broken tag.
    platform: ${BROKER_PLATFORM:-linux/amd64}
    environment:
      # THE TOPICS ARE FIXED HERE AND NOWHERE ELSE. booblik does not create topics — the set is
      # decided at startup, on purpose — so adding a fourth is a broker restart, which makes topic
      # naming an architectural decision rather than a runtime one.
      #
      # One partition each. Ordering inside a topic is worth more to this product than parallelism
      # nobody has measured a need for: every event about one order must arrive in the order it
      # happened, and an order exists only inside a partition.
      BOOBLIK_TOPICS: orders:1,usage:1,notifications:1
    volumes:
      - broker-data:/var/lib/booblik
    # NO PORTS. The broker speaks a plaintext protocol with neither TLS nor authentication — both
    # deliberately absent, being incompatible with its zero-copy read path — so it must never be
    # reachable from outside this network. That is the whole of its security model, and it is one
    # line of YAML away from not being true.

  # MIGRATIONS RUN BEFORE ANY SERVER, from the same image with a switch, and the servers wait for it
  # to EXIT SUCCESSFULLY rather than to start. During a rolling deploy this is a job that finishes
  # before the new pods roll; here it is the same thing in one file. Two processes racing to migrate
  # is the failure it removes, and Flyway's own lock turns that race into a hang rather than an error.
  migrate:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/konekt
      DB_USER: konekt
      DB_PASSWORD: konekt
      MIGRATE_ONLY: "true"
      # Read at startup and required, even though this process will never serve. A config that is
      # only half-validated in the migrate path is a config whose mistake is found by the server.
      JWT_SECRET: ${JWT_SECRET:-dev-secret-not-for-anything-real}
    restart: "no"

  # Needs the distribution built first — see deploy/Dockerfile for why it is not built inside the
  # image:
  #
  #     ./gradlew :server:installDist
  server:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      broker:
        condition: service_started
      migrate:
        condition: service_completed_successfully
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/konekt
      DB_USER: konekt
      DB_PASSWORD: konekt
      JWT_SECRET: ${JWT_SECRET:-dev-secret-not-for-anything-real}
      BROKER_HOST: broker
      BROKER_PORT: "9092"
      # Development only: the endpoint that reads back a one-time code. Absent means closed, which is
      # why the default is not "true".
      DEV_REVEAL_OTP: ${DEV_REVEAL_OTP:-true}
      # The forward-compatibility screen: a component no client can render, beside ones that can. A
      # separate switch from the OTP readback because they are separate decisions, and on here
      # because a stand that cannot show the degradation cannot demonstrate it.
      DEV_SCREENS: ${DEV_SCREENS:-true}
      # Which brand kit this deployment serves. One variable, and switching it is a redeploy rather
      # than a rebuild — which is the claim B-22 exists to demonstrate and the line an operator reads.
      BRAND: ${BRAND:-brand-a}
      PAYMENT_MOCK_MODE: ${PAYMENT_MOCK_MODE:-approve}
      PAYMENT_MOCK_DELAY_MS: ${PAYMENT_MOCK_DELAY_MS:-0}
      # Fictional usage against real counters, which is what makes a live update visible without
      # waiting for a subscriber to browse. Off by default everywhere else; on here because a stand
      # that cannot show the update cannot test it.
      SIMULATE_TRAFFIC: ${SIMULATE_TRAFFIC:-true}
      # THE THREE AGENTS. Each is `<NAME>_ENDPOINT` plus `<NAME>_KEY`, together or not at all — the
      # server refuses to start on one without the other, because a deployment that believes it is
      # observed and is not is the failure all three of these libraries make easy.
      #
      # metrik takes `host:port` and speaks UDP; the other two take a URL. Service names rather than
      # addresses, so the stand carries no host-dependent value.
      #
      # Overridable to EMPTY on purpose, and that is not a convenience. Setting both variables of a
      # pair to nothing is how the stand is asked to run with an agent switched off, which is the only
      # way to check that the e2e assertion about absent data can fail at all.
      # FIVE SECONDS, AGAINST A DEFAULT OF SIXTY. The agent buffers an aggregation window and sends it
      # when the window closes, so a process that has just started reports nothing for a minute. The
      # whole e2e run is shorter than that — and leaving the default is what made the check pass
      # locally against a stand that had been up a while and fail in CI against a fresh one.
      METRIK_WINDOW_MS: ${METRIK_WINDOW_MS:-5000}
      METRIK_ENDPOINT: ${METRIK_ENDPOINT-metrik:9999}
      METRIK_KEY: ${METRIK_KEY-${METRIK_INGEST_KEY:-dev-metrik-key}}
      TRACY_ENDPOINT: ${TRACY_ENDPOINT-http://tracy:8080}
      TRACY_KEY: ${TRACY_KEY-${TRACY_INGEST_KEY:-dev-tracy-key}}
      KATCHER_ENDPOINT: http://katcher:8080
      KATCHER_KEY: ${KATCHER_APP_KEY:-konekt-server}
      RELEASE: ${RELEASE:-stand}
      ENVIRONMENT: stand
    ports:
      - "${SERVER_PORT:-8080}:8080"

  # ── THE OBSERVABILITY TRIO ──────────────────────────────────────────────────────────────────────
  #
  # Three self-hosted binaries beside the server, and all three rather than one plus stdout for the
  # rest: the value being demonstrated is ONE purchase visible in all three at once — in tracy by its
  # `orderId`, in metrik as latency on the route it went through, in katcher if it fell over. Two of
  # them make that half a demonstration.
  #
  # They deliberately have no `depends_on` on the server and the server has none on them. An agent
  # that cannot reach its collector must not stop the product from serving, and wiring the dependency
  # the other way round would hide exactly that: the stand would refuse to start instead of showing
  # what a running system does when its observability is down.

  metrik:
    image: ghcr.io/youndie/metrik:latest
    environment:
      # One key per INSTALLATION rather than per service — metrik has no registration step, so the
      # service name IS the identifier and a typo creates a phantom service rather than an error.
      METRIK_INGEST_KEY: ${METRIK_INGEST_KEY:-dev-metrik-key}
      METRIK_HTTP_PORT: "8080"
      METRIK_UDP_PORT: "9999"
      METRIK_DB_PATH: /data/metrik.db
    volumes:
      - metrik-data:/data
    ports:
      - "${METRIK_PORT:-8090}:8080"

  tracy:
    image: ghcr.io/youndie/tracy:latest
    environment:
      TRACY_INGEST_KEY: ${TRACY_INGEST_KEY:-dev-tracy-key}
    volumes:
      - tracy-data:/data
    ports:
      - "${TRACY_PORT:-8091}:8080"

  katcher:
    image: ghcr.io/youndie/katcher:latest
    volumes:
      # `/app/data`, NOT `/data`, and the difference was a volume that persisted nothing. katcher
      # writes `local.db` under `/app/data` — read out of `docker diff`, after a deliberate crash
      # showed zero files in the mounted directory both before and after. A working pipeline would
      # have shown exactly the same thing there, which is what made the wrong mount invisible.
      - katcher-data:/app/data
    ports:
      - "${KATCHER_PORT:-8092}:8080"

  # AN APPLICATION AND A KEY, WITHOUT WHICH KATCHER REFUSES EVERY REPORT.
  #
  # `Katcher.catch` posts to `/api/reports` with an app key, and the collector looks it up in
  # `app_keys` — read out of its own schema. A fresh katcher has `apps: 0`, `app_keys: 0`, `users: 0`,
  # so the key this stand configures names an application that does not exist and every report is
  # refused. Nothing about that is visible from the server: the agent queues, uploads, and is turned
  # away, which is the same silence as an agent that was never started.
  #
  # SEEDED RATHER THAN CREATED THROUGH THE UI, and the reason is the key. `POST /apps` issues a
  # GENERATED key, which no compose file can know in advance — the server would have to be restarted
  # with a value that did not exist when it started. Writing the row directly is what lets the key be
  # a constant the whole stand agrees on.
  #
  # BEHIND A PROFILE, so `up` does not start it and `--wait` does not wait for it. A one-shot
  # container that exits is an error to `--wait` unless something depends on it with
  # `service_completed_successfully` — and the one candidate is the server, which deliberately has NO
  # dependency on the observability trio in either direction: an agent that cannot reach its collector
  # must not stop the product from serving. `make stand-up` runs it as an explicit step instead.
  katcher-seed:
    image: alpine:3.20
    profiles: ["seed"]
    depends_on:
      # `service_started` and not `service_healthy`: the katcher image declares no healthcheck, and
      # asking for one is a stand that refuses to come up at all. So the wait is on the FACT this
      # needs — the tables existing — rather than on a status nobody publishes.
      katcher:
        condition: service_started
    volumes:
      - katcher-data:/app/data
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -e
        apk add --no-cache sqlite >/dev/null
        # katcher migrates its schema on startup, and this container races it. Waiting for the table
        # rather than sleeping a guessed number of seconds: a sleep that is long enough today is the
        # thing that breaks on a slower machine and looks like a broken seed.
        i=0
        until sqlite3 /app/data/local.db "SELECT 1 FROM app_keys LIMIT 1;" >/dev/null 2>&1; do
          i=$$((i+1))
          if [ "$$i" -gt 60 ]; then
            echo "katcher never created app_keys — nothing to seed, and every report would be refused"
            exit 1
          fi
          sleep 1
        done
        # Idempotent, because this runs on every `up`. `INSERT OR IGNORE` is enough for the KEYS —
        # `app_keys.api_key` is uniquely indexed — and is NOT enough for the apps: `apps` has no
        # unique index on `name`, so `OR IGNORE` silently inserted a second one every run and left
        # four applications behind two keys. `WHERE NOT EXISTS` is what actually says "once".
        sqlite3 /app/data/local.db "
          INSERT INTO apps (name, type) SELECT 'konekt-server', 'JVM'
            WHERE NOT EXISTS (SELECT 1 FROM apps WHERE name = 'konekt-server');
          INSERT OR IGNORE INTO app_keys (app_id, api_key, created_at)
            SELECT id, 'konekt-server', 0 FROM apps WHERE name = 'konekt-server';
          INSERT INTO apps (name, type) SELECT 'konekt-client', 'COMPOSE_MULTIPLATFORM'
            WHERE NOT EXISTS (SELECT 1 FROM apps WHERE name = 'konekt-client');
          INSERT OR IGNORE INTO app_keys (app_id, api_key, created_at)
            SELECT id, 'konekt-client', 0 FROM apps WHERE name = 'konekt-client';
        "
        sqlite3 /app/data/local.db "SELECT 'seeded app_keys: ' || COUNT(*) FROM app_keys;"
    restart: "no"

  # THE SAME SERVER WITH THE PAYMENT MOCK SET TO REFUSE, and it is a second service rather than a
  # switch on the first because the mode is read once at startup. The compensated branch is one of
  # the three scenarios this stand exists for, and the only other way to reach it is to abandon a
  # confirmation and wait out its five-minute deadline — which is a test nobody runs twice.
  #
  # It shares the database and the broker on purpose: a rollback that only works in isolation is not
  # the thing being demonstrated.
  server-declining:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      broker:
        condition: service_started
      migrate:
        condition: service_completed_successfully
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/konekt
      DB_USER: konekt
      DB_PASSWORD: konekt
      JWT_SECRET: ${JWT_SECRET:-dev-secret-not-for-anything-real}
      BROKER_HOST: broker
      BROKER_PORT: "9092"
      DEV_REVEAL_OTP: ${DEV_REVEAL_OTP:-true}
      PAYMENT_MOCK_MODE: decline
      # No traffic from this one: two simulators against one set of counters would each be spending
      # what the other measured.
      SIMULATE_TRAFFIC: "false"
    ports:
      - "${DECLINING_SERVER_PORT:-8081}:8080"

volumes:
  postgres-data:
  broker-data:
  metrik-data:
  tracy-data:
  katcher-data:
