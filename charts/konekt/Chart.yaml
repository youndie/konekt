apiVersion: v2
name: konekt
description: konekt — a reference implementation of six Kotlin toolkits on an eSIM MVNO domain, server side, with the broker and the database it cannot run without
type: application
# 0.1.0 -> 0.2.0, and the reason is written down rather than felt.
#
# THE ONE SHAPE CHANGE SINCE THIS CHART WAS CREATED is `B-91`: `templates/server.yaml` gained a
# refusal of any `replicas > 1`, and `values.yaml` gained three values beside it. That turns a render
# somebody could previously produce — two replicas — into a failure, which is a BREAKING change for
# anyone consuming this chart. Below 1.0.0 a breaking change moves the minor, so 0.2.0.
#
# The rule from here: a change under `templates/` or in `values.yaml` that could break an existing
# render — a value removed, renamed or newly required, a refusal added — moves the MINOR while this
# is 0.x. An additive, compatible change moves the PATCH. Prose in this file moves nothing: a version
# bumped for a description teaches people to bump it without reading, which is how the number stops
# meaning anything.
#
# `scripts/chart_version.py` refuses a shape that moved while this did not.
# 0.2.0 -> 0.2.1: `B-100` added three broker settings to `values.yaml` and passed them from the
# template. A values file that does not mention them renders exactly as before and gets the
# defaults, so nothing an existing consumer wrote stops working — additive, and by the rule above
# that moves the PATCH.
# 0.2.1 -> 0.2.2: the three broker numbers are quoted. They rendered as floats in scientific
# notation and the broker refused to start on them, so the shape did move — a chart that cannot be
# deployed and one that can are not the same shape.
# 0.2.3 -> 0.2.4: `B-123` gave the server a startup probe and took the initial delay off readiness,
# so a pod that answers /health in two seconds is ready in two rather than five. A values file
# written for 0.2.3 renders under this without a change; the shape moved, additively — PATCH.
# 0.2.4 -> 0.2.5: `B-124` sets the broker's segment to the 512 MiB the cluster's log already has and
# the retention to two of them; a values file that names neither renders with the new defaults, and
# one that names them renders as it did — additive, PATCH.
# 0.2.5 -> 0.3.0: `konekt#32` split one probe route into three, so the three probes now point at
# `/health/startup`, `/health/live` and `/health/ready` instead of all three at `/health`. A values
# file written for 0.2.5 renders under this unchanged — nothing was removed, renamed or newly
# required — so BY THE LETTER of the rule above this is a PATCH.
#
# It is a MINOR, and the reason is a case the rule's list does not cover. That list is about values;
# this adds a requirement on the IMAGE. A deployment that takes this chart and keeps a `server.version`
# from before the routes existed gets pods whose startup probe never passes, which is worse than a
# render that fails — it fails during a rollout rather than at `helm template`. The chart and the
# application have separate lifetimes here precisely so that a coupling like this has to be stated,
# and a PATCH would have said the opposite.
# 0.3.0 -> 0.4.0: `konekt#35` gave every variable the `KONEKT_` prefix and one declared schema, so
# the template now sets `KONEKT_DB_URL` where it set `DB_URL`, and the pod sets
# `enableServiceLinks: false` so the kubelet cannot write into that prefix. Nothing in `values.yaml`
# moved — a values file written for 0.3.0 renders under this unchanged — so BY THE LETTER this is
# again a PATCH.
#
# It is a MINOR for the same reason 0.3.0 was, and harder: this chart and the image must now agree
# on the NAME OF EVERY VARIABLE. An old image under this chart reads none of its configuration —
# `KONEKT_DB_URL` is not `DB_URL` — and refuses to start on a missing required value; a new image
# under 0.3.0 refuses for the same reason from the other side. Neither failure happens at
# `helm template`; both happen in a rollout, which is exactly the coupling the version is supposed
# to announce.
# 0.4.0 -> 0.5.0: `konekt#30` took the three agents from kore's `installKoreObservability`, which
# renames `KONEKT_OBSERVABILITY_SERVICE` to `KONEKT_SERVICE` — and makes it REQUIRED, on the init
# container too — and adds `observability.tracy.sampleRate` to `values.yaml`. A values file written
# for 0.4.0 renders under this unchanged, so BY THE LETTER this is a PATCH again.
#
# MINOR, and for the third time the reason is the image rather than the values: this chart now sets a
# variable name the old image does not read and omits the one it does, and the new image refuses to
# start without `KONEKT_SERVICE`. As before, neither failure happens at `helm template`.
version: 0.5.0
# Deliberately empty, and the render fails when `server.version` is empty too.
#
# A chart version and an application version are two different lifetimes here: the shape of this
# deployment changes when a template does, and the binary changes when a tag is cut in this
# repository. Writing one into the other would make every image bump a chart bump, and the chart's
# version would then say nothing about whether the shape moved.
appVersion: ""
