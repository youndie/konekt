{{/*
The database: one pod, one volume, Recreate.

Not a statefulset, and the difference here is nil: one replica of either is one pod with one claim.
A Deployment says what this is — a single instance whose data is a volume — without the ordinal
naming and the manual claim cleanup a StatefulSet brings with it.

Recreate rather than RollingUpdate for the reason the volume is ReadWriteOnce: a rolling update
waits for a volume the outgoing pod has not released, which reads as a deploy that hangs rather than
as a disk that cannot be shared.
*/}}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ .Release.Name }}-postgres
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: {{ .Values.postgres.class }}
  resources:
    requests:
      storage: {{ .Values.postgres.size }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-postgres
  labels:
    app: {{ .Release.Name }}-postgres
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: {{ .Release.Name }}-postgres
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}-postgres
      annotations:
        checksum/secrets: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
    spec:
      containers:
        - name: postgres
          image: {{ .Values.postgres.image | quote }}
          env:
            - name: POSTGRES_DB
              value: {{ .Values.postgres.database | quote }}
            - name: POSTGRES_USER
              value: {{ .Values.postgres.user | quote }}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-secrets
                  key: postgres-password
            # `/var/lib/postgresql` is the mount, and 18 puts its cluster in a SUBDIRECTORY of it —
            # so the data directory has to be named, or the image finds a lost+found beside nothing
            # and refuses. The pre-18 convention was to mount the data directory itself; 18 moved it
            # so that `pg_upgrade --link` has both versions inside one mount.
            - name: PGDATA
              value: /var/lib/postgresql/data
          ports:
            - name: postgres
              containerPort: 5432
          # `pg_isready` asks the server a question. A TCP probe would pass against a Postgres still
          # replaying its WAL, and the migration would then fail against a database that is up and
          # not yet listening for work.
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "{{ .Values.postgres.user }}", "-d", "{{ .Values.postgres.database }}"]
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "{{ .Values.postgres.user }}", "-d", "{{ .Values.postgres.database }}"]
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            {{- toYaml .Values.postgres.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: {{ .Release.Name }}-postgres
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-postgres
spec:
  selector:
    app: {{ .Release.Name }}-postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
