{{/*
Everything that must not be in a values file, in one object so that a change to any of them
restarts the pod — the deployment carries a checksum of this file.

The three agent keys are optional and appear only when their endpoint does; the two below are
required, and the render has already stopped if either is empty.
*/}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-secrets
type: Opaque
stringData:
  jwt-secret: {{ include "konekt.require" (dict "name" "jwtSecret" "because" "the server refuses to start without it, which arrives as a green deploy and a service that is down" "value" .Values.jwtSecret) | quote }}
  postgres-password: {{ include "konekt.require" (dict "name" "postgres.password" "because" "a database password written into a chart is one every reader of the chart can use from inside the cluster" "value" .Values.postgres.password) | quote }}
  {{- range $name := list "metrik" "tracy" "katcher" }}
  {{- $agent := index $.Values.observability $name }}
  {{- if $agent.key }}
  {{ $name }}-key: {{ $agent.key | quote }}
  {{- end }}
  {{- end }}
