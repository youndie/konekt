# A concurrent index cannot run inside a transaction.
#
# AND ONLY THIS. The other half of the recipe — `flyway.postgresql.transactional.lock=false`, without
# which Flyway's own lock deadlocks against the index build — is a CONFIGURATION property and not a
# script one: put here, Flyway refuses the whole run with "Unknown configuration property". It is set
# once in `DatabaseFactory`, where it belongs, because it is a property of how Flyway takes its lock
# rather than of any one script.
executeInTransaction=false
