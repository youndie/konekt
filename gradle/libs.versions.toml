# One line per version, and the comment above a line says what makes it non-obvious.
#
# Read docs/research/research-stack.md §1.1 before changing anything here: every version below was
# read from `repo1.maven.org`'s own maven-metadata.xml on 2026-08-25, not from the search API, which
# answers four of them stale.

[versions]

# --- the language and its plugins -------------------------------------------------------------

# NOT HERE: kotlin, ksp and agp come from `wip`, the catalogue the sborka release pinned below
# publishes (`wip.plugins.*`, and `wip.versions.*` where build-logic needs a bare number). Moving the
# compiler is moving `sborka`, so KSP — the compiler's symbol API, which fails at the processor when
# it does not match — and the compose COMPILER plugin can no longer drift from it. AGP is the Kotlin
# Multiplatform Android plugin (com.android.kotlin.multiplatform.library), not the old
# `com.android.library`; see docs/research/research-stack.md §1.1.

# WHAT THE ANDROID HALF COMPILES AND RUNS AGAINST. `compileSdk` is the API the code is compiled
# against and `minSdk` the floor a device must meet; they are separate numbers because raising the
# first is a build concern and raising the second drops devices.
#
# 37 because the toolkit requires it, not because it is the newest (B-129). Every kompot 0.38 AAR
# carries `minCompileSdk = 37` — AGP writes a library's own compileSdk into its AAR — and Compose 1.12
# brings androidx material3 1.5, which asks for 37 on its own. It used to be 36 on the principle that
# compiling against the newest API is how a build starts depending on something no released device
# has; that principle now costs the toolkit, so it gives way here, and `minSdk` is what still guards
# the devices. 26 is the floor Compose Multiplatform itself states, so a lower number would not buy a
# device.
androidCompileSdk = "37"
androidMinSdk = "26"

# `activity-compose`, and it moves on its own line because AndroidX does: it is not part of the
# Compose Multiplatform distribution and is not versioned with it.
androidxActivity = "1.13.0"

# Compose Multiplatform, MATCHED TO THE TOOLKIT'S BINARIES rather than to the newest release. kompot
# 0.38.0 is compiled against 1.12.1 (its UPGRADING.md, and `compose-multiplatform` in its catalogue),
# and mixing a different foundation with the material3 it carries fails at RUNTIME, inside a renderer:
#   AbstractMethodError: OutlinedTextFieldDefaults$$Lambda does not define ... CustomStyle.applyStyle
# Nothing fails to resolve and nothing fails to compile. See research-stack §1.10. This line, the one
# below, `viddik` and kompot move in ONE commit or not at all (B-129).
#
# Its COMPILER is not this version either: `org.jetbrains.kotlin.plugin.compose` ships with Kotlin
# and is versioned with it, which is why it comes from `wip` while this line stays here.
composeMultiplatform = "1.12.1"

# Material3 moves on its OWN line, exactly as it does in the toolkit's catalogue: it has no stable
# release on the 1.12 train, so tying it to the line above would ask for a version that was never
# published. This is the one kompot 0.38.0's binaries were built against, which is the whole
# requirement.
composeMaterial3 = "1.12.0-alpha03"

# NOT 3.6.0 — yet, and the reason changed. The first one is gone: 3.6.0 resolves okhttp 5.5.0, whose
# Android artefact refuses anything below API 37, and `androidCompileSdk` is 37 since B-129.
#
# The second is the test host. Tried on 2026-10-01 (youndie/konekt#56, both CI runs): the two
# `RealtimeStreamTest` cases that open a stream under `testApplication` never get their first frame
# and die at runTest's one-minute limit with UncompletedCoroutinesError — every other test, the e2e
# job included, passes. 3.6.0 changed `TestApplicationResponse.respondWriteChannelContent` to launch
# the writer in the CALL's coroutine context (KTOR-8705, ktorio/ktor@0ad7c7f), so a response that
# never ends — which is what an SSE stream is — now holds the call open; ktorio/ktor#5880, open at the
# time of writing, removes that job again. Moving this line waits for that fix, or for this test to
# run on a real engine the way the client's stream tests already do.
ktor = "3.5.2"
coroutines = "1.11.0"
serialization = "1.11.0"
datetime = "0.8.0"

# --- Java --------------------------------------------------------------------------------------
#
# 25 was REQUIRED when this was written: kompot and petich published variants tagged
# `org.gradle.jvm.version = 25`, and Gradle refuses to build a module on anything lower against
# them. That is no longer true of either — kompot 0.38.0 declares 17 and petich 0.4.0.112 declares
# 21, read from their `.module` files (B-129) — so 25 is now this build's choice rather than the
# toolkits' demand, and the same number as sborka's default toolchain.
#
# ONE READER: `:androidApp`. Every module with a Kotlin jvm or multiplatform plugin gets its toolchain
# from `sborka.base` (through `konekt.base`); the application module has neither — AGP 9 carries
# Kotlin itself — so the conventions never reach it, and it names the number here.
jvmToolchain = "25"
# The shared build conventions: the coordinate, the toolchain, the style, the test platform and the
# guard that every declared @Test ran — and, through the `wip` catalogue the release publishes, the
# compiler. Bumping this changes how every module is built.
sborka = "0.4.0.111"

# --- style -------------------------------------------------------------------------------------

ktlintPlugin = "14.2.0"
# The FORMATTER's version, separate from the plugin's and pinned explicitly — left to the plugin
# default the style shifts whenever the plugin is bumped, which is exactly when nobody reads the
# diff. It is a bare version string that nothing resolves, so nothing would update it either:
# renovate is told about it by hand.
# renovate: datasource=maven depName=com.pinterest.ktlint:ktlint-cli
ktlint = "1.8.0"

# --- the toolkits ------------------------------------------------------------------------------
#
# kompot is the ONLY thing here declared through a platform, and its version appears exactly once.
# The tail digit of a SNAPSHOT version is the CI run number, so kompot-core:0.30.0.71 beside
# kompot-client:0.30.0.72 resolves into a combination nobody ever built. Through the BOM that
# combination cannot be written down — which is why no kompot library below carries a version.
#
# A RELEASE FROM CENTRAL NOW, under its own group. 0.38.0 moved every artefact, the BOM, `form-core`,
# `form-standard` and `wizard-core` included, from `io.github.youndie` to `io.github.youndie.kompot`
# (its UPGRADING.md); Kotlin packages did not move, so no source file changed for it. It also moved
# the Compose half to 1.12, which is why `composeMultiplatform`, `composeMaterial3`, `viddik` and
# `androidCompileSdk` above moved in the same commit (B-129).
#
# CHECK THAT EVERY MODULE EXISTS AT THE VERSION BEFORE MOVING THIS LINE. The snapshot publication
# walks the modules alphabetically and fills in each one's pending versions as it goes, so for a
# while a version is real for `form-core` and absent for `wizard-core` — and the BOM, being early in
# the alphabet, is one of the first to appear. Bumping into that produces "Could not find" halfway
# through a CI run, naming an artefact rather than the mistake. Both .75 and .76 were incomplete for
# the whole time .77 was being published; the check is one loop over the coordinates below. All 28
# answered 200 on repo1.maven.org at 0.38.0.
#
# A SNAPSHOT AGAIN, for `B-116`: the confirmation as a sheet needs three things kompot made after
# 0.38.0 and has not released — the presentation header (its `B-70`), the layer state a design system
# of its own can read (`B-66`) and a `navigate` that closes the layer (`B-67`). 0.39.0.193 is the
# publication of the commit that added the last of them. The Compose line did not move (kompot's own
# catalogue still names 1.12.1 and material3 1.12.0-alpha03), so nothing above moved with it. The
# snapshot repository comes from sborka's settings plugin with a `io\.github\.youndie.*` filter,
# which covers the `io.github.youndie.kompot` group — read in the plugin and proved by the resolution.
# All 28 coordinates answered 200 on the snapshot repository at 0.39.0.193 before this line moved.
#
# 0.39.0.200 for the schema identifiers alone: kompot moved the `$id` prefix of its schema files off
# a domain it does not own (kompot#202), and konekt's four files are generated by the same
# `kompot-spec`, so they move with the pin or not at all. Nothing on the wire changed with it; the
# commits in between are kompot's build and lint. The same 200 check ran before this line moved.
#
# 0.39.0 FROM CENTRAL: kompot released 0.39.0 from v0.39.0 (4d860b8), two commits past 0.39.0.200 —
# both build and CI configuration. All 190 BOM coordinates answered 200 on repo1.maven.org first.
#
# A SNAPSHOT AGAIN, and this time for no feature: kompot opened the 0.40 STABILIZATION LINE (its
# `stabilize-0.40`), where consumers live on `0.40.0.<run>` and whatever they find becomes a kompot
# issue before 0.40.0 is cut — so the release is tested by the builds that will take it, not after.
# 0.40.0.208 is the publication of a659e6c. What it brings, read off its UPGRADING.md and SPEC §4.10:
# the DSL gains parameters (a binary break; konekt builds every tree through constructors and calls
# no DSL function, so nothing here recompiles differently), a divider and a table take their rule
# from the design system's `divider` and `table_header` roles (konekt sends neither component; its
# own hairlines are `surface.dividers`, drawn in the outline variant of the scheme the brand already
# repaints), `kompot-spec` ships `kompot.d.ts` in its jar, and the redis bus fails on a refused
# PSUBSCRIBE (konekt runs the in-memory bus). The Compose line did not move. All 190 BOM coordinates
# answered 200 on the snapshot repository at 0.40.0.208 before this line moved.
#
# 0.40.0.210 (d35ae36): the same line with SPEC section 6 saying what an unanswered surface role is
# (KompotSurface.Unspecified, kompot#217) and the studio DSL export keeping every wire field; no wire
# change. All BOM coordinates answered 200 at 0.40.0.210 first.
kompot = "0.40.0.210"

# A RELEASE NOW, AND FROM CENTRAL. petich moved to `io.github.youndie.petich` and published 0.1.0;
# `0.1.0.18` was a snapshot of the bare group, which nothing publishes to any more -- a pin that
# would have gone stale in place rather than by failing.
#
# `0.4.0.112` (B-128): the per-saga trace this server logs (petich B-58/B-60), and petich B-49..B-65
# on the way. Two columns come with it, from petich B-54 — `V14__petich_0_4_0_112.sql`.
#
# `0.4.0.120` (B-130): petich B-66, a resume writes its start before it runs a member. On .112 the
# first member after a confirmation was outside its own rollback — `Provision` throwing was never
# compensated, so a grant whose answer was lost could not be taken back by any undo konekt wrote
# (`ProvisionByOrderTest`). The other change on the way is B-64, a metrics callback nothing here
# implements. No schema change.
petich = "0.4.0.120"
booblik = "0.3.4"

# kore, the portfolio's process lifecycle. ALL FOUR MODULES ARE PORTFOLIO-ONLY — a comment here used
# to say `kore-core` and `kore-ktor` were on Maven Central and that is not true: `io/github/youndie/
# kore-core/maven-metadata.xml` answers 404 on Central, checked rather than recalled.
#
# 0.1.4, and every one of the three bumps so far was paid for by a measurement this repository made.
# 0.1.2 for `runUntilSignal`; 0.1.3 for `tracySampleRate` (youndie/kore#57) and for `kore-build`
# being published at all (#58); this one deletes three workarounds konekt was carrying:
#
#   * #68 — `ObservabilitySettings.metrikWindow`, so all three agents go back into one call
#   * #70 — `kore-build` wires a `kotlin("jvm")` module's `main` source set itself
#   * #71 — `GenerateBuildIdentity.commit` can be supplied where `.git` is not reachable
#
# Read out of the published jars rather than out of kore's working copy, which is where the spec was
# read and which has been ahead of every published version.
#
# Every module checked at this version before the bump, not just the first: this portfolio publishes
# modules alphabetically and a version is real for one while absent for another for a while.
kore = "0.1.4"
# vojak, leader election on Postgres advisory locks (B-135). Portfolio-only, like kore: the snapshot
# repository, `0.1.0.<run>` of vojak's main. Only `vojak-jdbc` — the store over the DataSource this
# server already has (vojak research D13). NOT `vojak-kore`: it pins kore 0.1.15 through `api`, and
# kore pins Ktor through `api` in turn, so it would move this server's Ktor under it; the election is
# closed by konekt's own "workers" shutdown participant instead.
vojak = "0.1.0.6"

# katcher is TWO version lines that move independently. A single `katcher = ...` resolves nothing
# for one of them and fails naming an artefact rather than the mistake.
#   - the server image and the Kotlin client, which share the repository's own version. As of
#     0.6.2 the client publishes all three iOS targets (youndie/katcher#25 closed it), so the
#     host-picked `native` target is gone and an iOS build can report a crash;
# 0.7.47 is the first with `flush(grace)`. Until it, katcher had no lifecycle function beyond
# `start`, so the reports buffered at the moment a process went down were the ones that explained why
# it went down, and they were lost. kore's shutdown participant calls it.
katcher = "0.7.47"
#   - the Android client and the Gradle plugin that uploads the R8 mapping, released together and
#     still on their own line.

metrikAgent = "0.3.21"
tracyAgent = "0.2.15"
# ON THE COMPOSE LINE, like the two Compose entries above. 0.6 is the one built on Compose 1.12; kompot
# 0.38.0 names 0.6.1 as the screenshot tester of the 1.12 line, and a 0.4 fixture renders through a
# 1.11 test harness beside a 1.12 foundation — the same mixing that throws inside a renderer (B-129).
# 0.6 declares Java 21 in its metadata, which a Java 25 test classpath accepts.
viddik = "0.6.1"

# The QR encoder behind esim_qr. See the coordinate below for why an encoder rather than a widget.
qrcode = "4.5.0"

