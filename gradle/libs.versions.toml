kompot-formCore = { module = "io.github.youndie.kompot:form-core" }
kompot-formStandard = { module = "io.github.youndie.kompot:form-standard" }
kompot-wizard = { module = "io.github.youndie.kompot:kompot-wizard" }
kompot-wizardCore = { module = "io.github.youndie.kompot:wizard-core" }
kompot-theme = { module = "io.github.youndie.kompot:kompot-theme" }
kompot-dsMaterial = { module = "io.github.youndie.kompot:kompot-ds-material" }
kompot-auth = { module = "io.github.youndie.kompot:kompot-auth" }
kompot-navigation = { module = "io.github.youndie.kompot:kompot-navigation" }
kompot-realtime = { module = "io.github.youndie.kompot:kompot-realtime" }
kompot-realtimeServer = { module = "io.github.youndie.kompot:kompot-realtime-server" }
# The bus shared by every replica (B-136): PUBLISH plus one PSUBSCRIBE over Lettuce, pointed at kesh.
