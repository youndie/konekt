[plugins]

# The Kotlin plugins, KSP, AGP's two and the compose COMPILER are `wip.plugins.*`: see the top of
# [versions].
# Compiles the commit, the build time and the version into a Kotlin object, which is what `/version`
# serves. A generated source rather than a resource or a manifest entry, because Kotlin/Native has
# neither — the plugin is shaped for the portfolio's native servers and the JVM gets the same answer.
koreBuild = { id = "io.github.youndie.kore.build", version.ref = "kore" }


# TWO plugins and they are versioned apart. `org.jetbrains.compose` is the Compose Multiplatform
# distribution, matched to the toolkit and kept here (B-129); `org.jetbrains.kotlin.plugin.compose` is
# the compiler plugin, which ships with Kotlin and therefore comes from `wip` with it
# (`wip.plugins.composeCompiler`). Pointing both at one ref is how a build ends up asking for a
# compiler version that was never released.
composeMultiplatform = { id = "org.jetbrains.compose", version.ref = "composeMultiplatform" }

# The screenshot tester's plugin. It exists because the wiring it replaces is silently wrong when
# hand-written: the right KSP configuration and snapshot directory depend on how the target is
# declared, and getting one wrong makes KSP report SKIPPED while the screenshot task passes with no
# tests in it. Published to Maven Central.
viddik = { id = "io.github.youndie.viddik", version.ref = "viddik" }
ktlint = { id = "org.jlleitschuh.gradle.ktlint", version.ref = "ktlintPlugin" }
sborkaBase = { id = "io.github.youndie.sborka.base", version.ref = "sborka" }
sborkaJvm = { id = "io.github.youndie.sborka.jvm", version.ref = "sborka" }
sborkaKmp = { id = "io.github.youndie.sborka.kmp", version.ref = "sborka" }
sborkaLint = { id = "io.github.youndie.sborka.lint", version.ref = "sborka" }
sborkaTest = { id = "io.github.youndie.sborka.test", version.ref = "sborka" }
flyway = { id = "org.flywaydb.flyway", version.ref = "flyway" }
# Published to Maven Central, not to the Gradle Plugin Portal.
exposedMigrations = { id = "org.jetbrains.exposed.plugin", version.ref = "exposedPlugin" }
zavarnik = { id = "io.github.youndie.zavarnik", version.ref = "zavarnik" }
jib = { id = "com.google.cloud.tools.jib", version.ref = "jib" }
