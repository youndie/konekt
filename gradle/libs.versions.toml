mockk = "1.14.11"
turbine = "1.2.1"
# Repository and route tests run against the real Postgres, not H2: the defect they exist for lives
# in the SQL, and H2's compatibility mode diverges on ON CONFLICT, SELECT ... FOR UPDATE and jsonb —
# all three load-bearing here. docs/research/research-stack.md D16.
testcontainers = "1.21.4"

logback = "1.6.3"

[libraries]

# --- kotlin ------------------------------------------------------------------------------------

kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }
# THE MAIN DISPATCHER FOR A SWING DESKTOP, and it is a runtime implementation rather than an API.
# `kotlinx-coroutines-core` declares `Dispatchers.Main` and ships no provider: the platform module
# does, through a ServiceLoader — `-android` on Android, this one on Swing. Without it `Main` is not
# a slow dispatcher, it throws.
kotlinx-coroutines-swing = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-swing", version.ref = "coroutines" }
# The same hole on the other platform: on Android the `Dispatchers.Main` provider is this artefact,
# and a build without it throws at the first line that names `Main` rather than running slowly.
kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }

# THE ONE ANDROID-ONLY UI DEPENDENCY. `ComponentActivity.setContent` is what puts a `@Composable` on
# an Android screen — the platform's equivalent of `ComposeUIViewController` and of Compose Desktop's
# `Window`, and the only piece of the three that AndroidX owns.
androidx-activityCompose = { module = "androidx.activity:activity-compose", version.ref = "androidxActivity" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "serialization" }
kotlinx-datetime = { module = "org.jetbrains.kotlinx:kotlinx-datetime", version.ref = "datetime" }

# --- ktor: server ------------------------------------------------------------------------------

ktor-server-core = { module = "io.ktor:ktor-server-core", version.ref = "ktor" }
# CIO, not Netty: the load-bearing endpoint is SSE — many long-lived, mostly idle streams, which is
# the profile a coroutine-per-connection engine is shaped for. docs/research/research-stack.md D19.
ktor-server-cio = { module = "io.ktor:ktor-server-cio", version.ref = "ktor" }
ktor-server-resources = { module = "io.ktor:ktor-server-resources", version.ref = "ktor" }
ktor-server-contentNegotiation = { module = "io.ktor:ktor-server-content-negotiation", version.ref = "ktor" }
ktor-server-statusPages = { module = "io.ktor:ktor-server-status-pages", version.ref = "ktor" }
ktor-server-auth = { module = "io.ktor:ktor-server-auth", version.ref = "ktor" }
ktor-server-authJwt = { module = "io.ktor:ktor-server-auth-jwt", version.ref = "ktor" }
ktor-server-sse = { module = "io.ktor:ktor-server-sse", version.ref = "ktor" }
ktor-server-callLogging = { module = "io.ktor:ktor-server-call-logging", version.ref = "ktor" }
ktor-server-testHost = { module = "io.ktor:ktor-server-test-host", version.ref = "ktor" }
ktor-serialization-json = { module = "io.ktor:ktor-serialization-kotlinx-json", version.ref = "ktor" }

# --- ktor: client ------------------------------------------------------------------------------

ktor-client-core = { module = "io.ktor:ktor-client-core", version.ref = "ktor" }
ktor-client-cio = { module = "io.ktor:ktor-client-cio", version.ref = "ktor" }
ktor-client-resources = { module = "io.ktor:ktor-client-resources", version.ref = "ktor" }
# The multiplatform half: the @Resource annotation and the types both sides share. Declared once in a
# feature's -shared-api module so a path exists in exactly one place.
ktor-resources = { module = "io.ktor:ktor-resources", version.ref = "ktor" }
ktor-client-contentNegotiation = { module = "io.ktor:ktor-client-content-negotiation", version.ref = "ktor" }
# The bearer plugin: it holds the tokens and refreshes them on a 401. There is no `ktor-client-sse`
# artefact — the client's SSE plugin lives in ktor-client-core, which is easy to assume otherwise
# from the server side, where `ktor-server-sse` IS one.
ktor-client-auth = { module = "io.ktor:ktor-client-auth", version.ref = "ktor" }
ktor-client-mock = { module = "io.ktor:ktor-client-mock", version.ref = "ktor" }
# The Apple engine. `ktor-client-cio` covers JVM and the Linux/Windows native targets and NOT the
# Apple ones — a fact that surfaces as an unresolved `CIO` in `iosMain` rather than as a version
# conflict, which is why it is worth a line here rather than a guess at the call site.
ktor-client-darwin = { module = "io.ktor:ktor-client-darwin", version.ref = "ktor" }
# The Android engine. CIO runs on Android too, and OkHttp is what the platform's own networking is
# built on: it carries the device's trust store and its connection pooling rather than reimplementing
# both on top of NIO.
ktor-client-okhttp = { module = "io.ktor:ktor-client-okhttp", version.ref = "ktor" }

