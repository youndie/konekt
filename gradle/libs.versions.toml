# One line per version, and the comment above a line says what makes it non-obvious.
#
# Read docs/research/research-stack.md §1.1 before changing anything here: every version below was
# read from `repo1.maven.org`'s own maven-metadata.xml on 2026-08-25, not from the search API, which
# answers four of them stale.

[versions]

# --- the language and its plugins -------------------------------------------------------------

kotlin = "2.4.10"
# Matched to the Kotlin version, not chosen: KSP is the compiler's symbol API and a mismatch fails
# at the processor rather than at the plugin.
ksp = "2.3.11"
# The Kotlin Multiplatform Android plugin (com.android.kotlin.multiplatform.library), not the old
# `com.android.library`. See docs/research/research-stack.md §1.1.
agp = "9.3.1"

# WHAT THE ANDROID HALF COMPILES AND RUNS AGAINST. `compileSdk` is the API the code is compiled
# against and `minSdk` the floor a device must meet; they are separate numbers because raising the
# first is a build concern and raising the second drops devices.
#
# 36 rather than 37 deliberately: the build box carries both platforms, and compiling against the
# newest available API is how a build starts depending on something no released device has. 26 is the
# floor Compose Multiplatform itself states, so a lower number here would not buy a device.
androidCompileSdk = "36"
androidMinSdk = "26"

# `activity-compose`, and it moves on its own line because AndroidX does: it is not part of the
# Compose Multiplatform distribution and is not versioned with it.
androidxActivity = "1.13.0"

# Compose Multiplatform. NOT the newest — 1.12.0 was released — and the difference is not caution.
# The toolkit's Compose modules are compiled against 1.11.1, and mixing a newer foundation with the
# material3 they carry fails at RUNTIME, inside a renderer:
#   AbstractMethodError: OutlinedTextFieldDefaults$$Lambda does not define ... CustomStyle.applyStyle
# Nothing fails to resolve and nothing fails to compile. See research-stack §1.10.
#
# Its COMPILER is not this version either: `org.jetbrains.kotlin.plugin.compose` ships with Kotlin
# and is versioned with it, which is why the two plugin aliases below point at different refs.
composeMultiplatform = "1.11.1"

# Material3 moves on its OWN line, exactly as it does in the toolkit's catalogue: it has no stable
# release in either train (`<latest>1.12.0-alpha03` on 2026-08-25), so tying it to the line above
# would ask for a version that was never published. This is the one the toolkit's binaries were
# built against, which is the whole requirement.
composeMaterial3 = "1.11.0-alpha07"

ktor = "3.5.2"
coroutines = "1.11.0"
serialization = "1.11.0"
datetime = "0.8.0"

# --- Java --------------------------------------------------------------------------------------
#
# 25 is required, not preferred: kompot and petich publish variants tagged
# `org.gradle.jvm.version = 25`, and Gradle refuses to build a module on anything lower against
# them. It lives here so the convention plugin reads it rather than repeating the literal.
jvmToolchain = "25"
# The shared build conventions: the coordinate, the toolchain, the style, the test platform and the
# guard that every declared @Test ran. Bumping this changes how every module is built.
sborka = "0.1.0.18"

# --- style -------------------------------------------------------------------------------------

ktlintPlugin = "14.2.0"
# The FORMATTER's version, separate from the plugin's and pinned explicitly — left to the plugin
# default the style shifts whenever the plugin is bumped, which is exactly when nobody reads the
# diff. It is a bare version string that nothing resolves, so nothing would update it either:
# renovate is told about it by hand.
# renovate: datasource=maven depName=com.pinterest.ktlint:ktlint-cli
ktlint = "1.8.0"

# --- the toolkits ------------------------------------------------------------------------------
#
# kompot is the ONLY thing here declared through a platform, and its version appears exactly once.
# The tail digit of a kompot version is the CI run number, so kompot-core:0.30.0.71 beside
# kompot-client:0.30.0.72 resolves into a combination nobody ever built. Through the BOM that
# combination cannot be written down — which is why no kompot library below carries a version.
#
# CHECK THAT EVERY MODULE EXISTS AT THE VERSION BEFORE MOVING THIS LINE. The publication walks the
# modules alphabetically and fills in each one's pending versions as it goes, so for a while a
# version is real for `form-core` and absent for `wizard-core` — and the BOM, being early in the
# alphabet, is one of the first to appear. Bumping into that produces "Could not find" halfway
# through a CI run, naming an artefact rather than the mistake. Both .75 and .76 were incomplete for
# the whole time .77 was being published; the check is one loop over the coordinates below.
kompot = "0.36.1.112"

petich = "0.1.0.10"
booblik = "0.3.1"

# katcher is TWO version lines that move independently. A single `katcher = ...` resolves nothing
# for one of them and fails naming an artefact rather than the mistake.
#   - the server image and the Kotlin client, which share the repository's own version. As of
#     0.6.2 the client publishes all three iOS targets (youndie/katcher#25 closed it), so the
#     host-picked `native` target is gone and an iOS build can report a crash;
katcher = "0.6.41"
#   - the Android client and the Gradle plugin that uploads the R8 mapping, released together and
#     still on their own line.

metrikAgent = "0.1.13"
tracyAgent = "0.1.13"
viddik = "0.1.2.13"

# The QR encoder behind esim_qr. See the coordinate below for why an encoder rather than a widget.
qrcode = "4.5.0"

# --- persistence -------------------------------------------------------------------------------

# exposed-core publishes no common metadata variant (only jvm), which is why every module that
# touches it is kotlin("jvm") and not multiplatform. docs/research/research-stack.md §1.2.
exposed = "1.5.0"
# The Gradle plugin shares Exposed's version line and lives on Maven Central rather than the Gradle
# Plugin Portal — hence mavenCentral() in settings.gradle.kts's pluginManagement.
exposedPlugin = "1.5.0"
# One version for flyway-core, flyway-database-postgresql and the Gradle plugin.
flyway = "13.3.0"
hikari = "7.1.0"
postgresql = "42.7.13"

# --- DI ----------------------------------------------------------------------------------------

koin = "4.2.2"

# --- testing -----------------------------------------------------------------------------------

# MockK publishes `common` and `jvm` and nothing else, so it resolves in a jvm()-only module and
# not in one that also targets iOS or Android. docs/research/research-stack.md §1.3.
mockk = "1.14.11"
turbine = "1.2.1"
# Repository and route tests run against the real Postgres, not H2: the defect they exist for lives
# in the SQL, and H2's compatibility mode diverges on ON CONFLICT, SELECT ... FOR UPDATE and jsonb —
# all three load-bearing here. docs/research/research-stack.md D16.
testcontainers = "1.21.4"

logback = "1.6.3"

[libraries]

# --- kotlin ------------------------------------------------------------------------------------

kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }
# THE MAIN DISPATCHER FOR A SWING DESKTOP, and it is a runtime implementation rather than an API.
# `kotlinx-coroutines-core` declares `Dispatchers.Main` and ships no provider: the platform module
# does, through a ServiceLoader — `-android` on Android, this one on Swing. Without it `Main` is not
# a slow dispatcher, it throws.
kotlinx-coroutines-swing = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-swing", version.ref = "coroutines" }
# The same hole on the other platform: on Android the `Dispatchers.Main` provider is this artefact,
# and a build without it throws at the first line that names `Main` rather than running slowly.
kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }

# THE ONE ANDROID-ONLY UI DEPENDENCY. `ComponentActivity.setContent` is what puts a `@Composable` on
# an Android screen — the platform's equivalent of `ComposeUIViewController` and of Compose Desktop's
# `Window`, and the only piece of the three that AndroidX owns.
androidx-activityCompose = { module = "androidx.activity:activity-compose", version.ref = "androidxActivity" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "serialization" }
kotlinx-datetime = { module = "org.jetbrains.kotlinx:kotlinx-datetime", version.ref = "datetime" }

# --- ktor: server ------------------------------------------------------------------------------

ktor-server-core = { module = "io.ktor:ktor-server-core", version.ref = "ktor" }
# CIO, not Netty: the load-bearing endpoint is SSE — many long-lived, mostly idle streams, which is
# the profile a coroutine-per-connection engine is shaped for. docs/research/research-stack.md D19.
ktor-server-cio = { module = "io.ktor:ktor-server-cio", version.ref = "ktor" }
ktor-server-resources = { module = "io.ktor:ktor-server-resources", version.ref = "ktor" }
ktor-server-contentNegotiation = { module = "io.ktor:ktor-server-content-negotiation", version.ref = "ktor" }
ktor-server-statusPages = { module = "io.ktor:ktor-server-status-pages", version.ref = "ktor" }
ktor-server-auth = { module = "io.ktor:ktor-server-auth", version.ref = "ktor" }
ktor-server-authJwt = { module = "io.ktor:ktor-server-auth-jwt", version.ref = "ktor" }
ktor-server-sse = { module = "io.ktor:ktor-server-sse", version.ref = "ktor" }
ktor-server-callLogging = { module = "io.ktor:ktor-server-call-logging", version.ref = "ktor" }
ktor-server-testHost = { module = "io.ktor:ktor-server-test-host", version.ref = "ktor" }
ktor-serialization-json = { module = "io.ktor:ktor-serialization-kotlinx-json", version.ref = "ktor" }

# --- ktor: client ------------------------------------------------------------------------------

ktor-client-core = { module = "io.ktor:ktor-client-core", version.ref = "ktor" }
ktor-client-cio = { module = "io.ktor:ktor-client-cio", version.ref = "ktor" }
ktor-client-resources = { module = "io.ktor:ktor-client-resources", version.ref = "ktor" }
# The multiplatform half: the @Resource annotation and the types both sides share. Declared once in a
# feature's -shared-api module so a path exists in exactly one place.
ktor-resources = { module = "io.ktor:ktor-resources", version.ref = "ktor" }
ktor-client-contentNegotiation = { module = "io.ktor:ktor-client-content-negotiation", version.ref = "ktor" }
# The bearer plugin: it holds the tokens and refreshes them on a 401. There is no `ktor-client-sse`
# artefact — the client's SSE plugin lives in ktor-client-core, which is easy to assume otherwise
# from the server side, where `ktor-server-sse` IS one.
ktor-client-auth = { module = "io.ktor:ktor-client-auth", version.ref = "ktor" }
ktor-client-mock = { module = "io.ktor:ktor-client-mock", version.ref = "ktor" }
# The Apple engine. `ktor-client-cio` covers JVM and the Linux/Windows native targets and NOT the
# Apple ones — a fact that surfaces as an unresolved `CIO` in `iosMain` rather than as a version
# conflict, which is why it is worth a line here rather than a guess at the call site.
ktor-client-darwin = { module = "io.ktor:ktor-client-darwin", version.ref = "ktor" }
# The Android engine. CIO runs on Android too, and OkHttp is what the platform's own networking is
# built on: it carries the device's trust store and its connection pooling rather than reimplementing
# both on top of NIO.
ktor-client-okhttp = { module = "io.ktor:ktor-client-okhttp", version.ref = "ktor" }

# --- kompot ------------------------------------------------------------------------------------
#
# No version on any of these, on purpose. The platform below constrains every coordinate this
# toolkit publishes, including the per-target ones a Kotlin Multiplatform module adds beside its
# root (kompot-core-jvm, kompot-core-iosarm64 ...), so naming one of those directly is covered too.
kompot-bom = { module = "io.github.youndie:kompot-bom", version.ref = "kompot" }
kompot-core = { module = "io.github.youndie:kompot-core" }
kompot-standard = { module = "io.github.youndie:kompot-standard" }
kompot-ktor = { module = "io.github.youndie:kompot-ktor" }
kompot-forms = { module = "io.github.youndie:kompot-forms" }
kompot-formsStandard = { module = "io.github.youndie:kompot-forms-standard" }
kompot-formCore = { module = "io.github.youndie:form-core" }
kompot-formStandard = { module = "io.github.youndie:form-standard" }
kompot-wizard = { module = "io.github.youndie:kompot-wizard" }
kompot-wizardCore = { module = "io.github.youndie:wizard-core" }
kompot-theme = { module = "io.github.youndie:kompot-theme" }
kompot-dsMaterial = { module = "io.github.youndie:kompot-ds-material" }
kompot-auth = { module = "io.github.youndie:kompot-auth" }
kompot-navigation = { module = "io.github.youndie:kompot-navigation" }
kompot-realtime = { module = "io.github.youndie:kompot-realtime" }
kompot-realtimeServer = { module = "io.github.youndie:kompot-realtime-server" }
kompot-analytics = { module = "io.github.youndie:kompot-analytics" }
kompot-registryAnnotations = { module = "io.github.youndie:kompot-registry-annotations" }
kompot-registryProcessor = { module = "io.github.youndie:kompot-registry-processor" }
kompot-spec = { module = "io.github.youndie:kompot-spec" }
kompot-tck = { module = "io.github.youndie:kompot-tck" }
# The Compose side. Arrives with the client module; listed here so the platform covers it from the
# start rather than being remembered later.
kompot-client = { module = "io.github.youndie:kompot-client" }
kompot-clientCache = { module = "io.github.youndie:kompot-client-cache" }
kompot-formsClient = { module = "io.github.youndie:kompot-forms-client" }
kompot-wizardClient = { module = "io.github.youndie:kompot-wizard-client" }
kompot-themeClient = { module = "io.github.youndie:kompot-theme-client" }
kompot-dsMaterialCompose = { module = "io.github.youndie:kompot-ds-material-compose" }

# --- the client's own Compose dependencies ------------------------------------------------------
#
# Everything else Compose comes through the `compose.*` accessors the Compose plugin installs
# (compose.runtime, compose.material3, compose.desktop.currentOs). ui-test has no accessor, so it is
# the one that needs a coordinate.
# Named by coordinate rather than through the plugin's `compose.runtime` / `compose.ui` /
# `compose.foundation` accessors, which 1.11.1 deprecates in favour of exactly this ("Specify
# dependency directly"). It also removes the whole class of mismatch that material3 fell into: an
# accessor carries a version of its own, and which one it carries is not visible from the build file.
compose-runtime = { module = "org.jetbrains.compose.runtime:runtime", version.ref = "composeMultiplatform" }
compose-ui = { module = "org.jetbrains.compose.ui:ui", version.ref = "composeMultiplatform" }
compose-foundation = { module = "org.jetbrains.compose.foundation:foundation", version.ref = "composeMultiplatform" }
compose-uiTest = { module = "org.jetbrains.compose.ui:ui-test", version.ref = "composeMultiplatform" }

# A QR ENCODER and not a QR widget, which is the whole reason it is this one. It answers a matrix of
# dark and light modules; the drawing is ours, so the code comes out in the design system's colours
# and shapes instead of a library's idea of them. Published for jvm, android and the three iOS
# targets, so it survives the client growing. Read from repo1.maven.org on 2026-08-25.
qrcode = { module = "io.github.g0dkar:qrcode-kotlin", version.ref = "qrcode" }
# Named by coordinate rather than taken from the plugin's `compose.material3` accessor, because that
# accessor is pinned to a version of its own and loses to whatever the toolkit asks for — which is
# how foundation 1.12.0 came to sit beside material3 1.11.0-alpha07 and throw at render time.
compose-material3 = { module = "org.jetbrains.compose.material3:material3", version.ref = "composeMaterial3" }

# The screenshot tester. `viddik-annotations` and `viddik-testing-core` are added by its Gradle
# plugin, so these entries exist only for the day a module opts out of that with
# `addDependencies = false`; the plugin's own version is the one that decides what it pulls.
viddik-annotations = { module = "ru.workinprogress:viddik-annotations", version.ref = "viddik" }
viddik-testingCore = { module = "ru.workinprogress:viddik-testing-core", version.ref = "viddik" }
kompot-clientTck = { module = "io.github.youndie:kompot-client-tck" }

# --- petich ------------------------------------------------------------------------------------

petich-core = { module = "io.github.youndie:petich-core", version.ref = "petich" }
petich-ktor = { module = "io.github.youndie:petich-ktor", version.ref = "petich" }
petich-postgres = { module = "io.github.youndie:petich-postgres", version.ref = "petich" }
petich-outboxCore = { module = "io.github.youndie:petich-outbox-core", version.ref = "petich" }
petich-idempotency = { module = "io.github.youndie:petich-idempotency", version.ref = "petich" }
petich-scheduler = { module = "io.github.youndie:petich-scheduler", version.ref = "petich" }

# --- booblik -----------------------------------------------------------------------------------
#
# JVM only: booblik-client is a src/main/kotlin source set. The broker itself is a container, not a
# dependency — see deploy/compose.yaml.
booblik-client = { module = "io.github.youndie.booblik:booblik-client", version.ref = "booblik" }

# --- observability -----------------------------------------------------------------------------

katcher-client = { module = "ru.workinprogress.katcher:client", version.ref = "katcher" }
metrik-agent = { module = "ru.workinprogress.metrik:agent", version.ref = "metrikAgent" }
tracy-agent = { module = "ru.workinprogress.tracy:agent", version.ref = "tracyAgent" }

# --- persistence -------------------------------------------------------------------------------

exposed-core = { module = "org.jetbrains.exposed:exposed-core", version.ref = "exposed" }
exposed-jdbc = { module = "org.jetbrains.exposed:exposed-jdbc", version.ref = "exposed" }
exposed-json = { module = "org.jetbrains.exposed:exposed-json", version.ref = "exposed" }
# Where MigrationUtils lives. SchemaUtils.statementsRequiredToActualizeScheme is deprecated in favour
# of it, and the deprecation names this coordinate — which is how the schema test found it.
exposed-migrationJdbc = { module = "org.jetbrains.exposed:exposed-migration-jdbc", version.ref = "exposed" }
exposed-kotlinDatetime = { module = "org.jetbrains.exposed:exposed-kotlin-datetime", version.ref = "exposed" }
flyway-core = { module = "org.flywaydb:flyway-core", version.ref = "flyway" }
# A separate coordinate since Flyway 10: without it the Postgres dialect is simply absent and the
# failure names the URL rather than the missing module.
flyway-postgresql = { module = "org.flywaydb:flyway-database-postgresql", version.ref = "flyway" }
hikari = { module = "com.zaxxer:HikariCP", version.ref = "hikari" }
postgresql = { module = "org.postgresql:postgresql", version.ref = "postgresql" }

# --- DI ----------------------------------------------------------------------------------------

koin-bom = { module = "io.insert-koin:koin-bom", version.ref = "koin" }
koin-core = { module = "io.insert-koin:koin-core" }
koin-ktor = { module = "io.insert-koin:koin-ktor" }
koin-loggerSlf4j = { module = "io.insert-koin:koin-logger-slf4j" }
koin-test = { module = "io.insert-koin:koin-test" }

# --- testing -----------------------------------------------------------------------------------

mockk = { module = "io.mockk:mockk", version.ref = "mockk" }
turbine = { module = "app.cash.turbine:turbine", version.ref = "turbine" }
testcontainers-core = { module = "org.testcontainers:testcontainers", version.ref = "testcontainers" }
testcontainers-junit = { module = "org.testcontainers:junit-jupiter", version.ref = "testcontainers" }
testcontainers-postgresql = { module = "org.testcontainers:postgresql", version.ref = "testcontainers" }

logback-classic = { module = "ch.qos.logback:logback-classic", version.ref = "logback" }

# AGP as a LIBRARY, for `build-logic`'s compile classpath. A convention plugin that configures an
# Android target names the Variant API by type, and the plugin marker does not carry it.
androidGradlePlugin = { module = "com.android.tools.build:gradle", version.ref = "agp" }

[plugins]

kotlinJvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlinMultiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
kotlinSerialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
androidKotlinMultiplatformLibrary = { id = "com.android.kotlin.multiplatform.library", version.ref = "agp" }
# The APPLICATION plugin, for the one module that produces an APK. A different id from the line
# above and the same AGP: the library plugin cannot build an application and vice versa.
androidApplication = { id = "com.android.application", version.ref = "agp" }


# TWO plugins and they are versioned apart. `org.jetbrains.compose` is the Compose Multiplatform
# distribution; `org.jetbrains.kotlin.plugin.compose` is the compiler plugin, which ships with Kotlin
# and therefore follows `kotlin`. Pointing both at one ref is how a build ends up asking for a
# compiler version that was never released.
composeMultiplatform = { id = "org.jetbrains.compose", version.ref = "composeMultiplatform" }
composeCompiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }

# The screenshot tester's plugin. It exists because the wiring it replaces is silently wrong when
# hand-written: the right KSP configuration and snapshot directory depend on how the target is
# declared, and getting one wrong makes KSP report SKIPPED while the screenshot task passes with no
# tests in it. Published to reposilite, which is why pluginManagement names that repository too.
viddik = { id = "ru.workinprogress.viddik", version.ref = "viddik" }
ktlint = { id = "org.jlleitschuh.gradle.ktlint", version.ref = "ktlintPlugin" }
sborkaBase = { id = "ru.workinprogress.sborka.base", version.ref = "sborka" }
sborkaJvm = { id = "ru.workinprogress.sborka.jvm", version.ref = "sborka" }
sborkaKmp = { id = "ru.workinprogress.sborka.kmp", version.ref = "sborka" }
sborkaLint = { id = "ru.workinprogress.sborka.lint", version.ref = "sborka" }
sborkaTest = { id = "ru.workinprogress.sborka.test", version.ref = "sborka" }
flyway = { id = "org.flywaydb.flyway", version.ref = "flyway" }
# Published to Maven Central, not to the Gradle Plugin Portal.
exposedMigrations = { id = "org.jetbrains.exposed.plugin", version.ref = "exposedPlugin" }
