# --- the client's own Compose dependencies ------------------------------------------------------
#
# Everything else Compose comes through the `compose.*` accessors the Compose plugin installs
# (compose.runtime, compose.material3, compose.desktop.currentOs). ui-test has no accessor, so it is
# the one that needs a coordinate.
# Named by coordinate rather than through the plugin's `compose.runtime` / `compose.ui` /
# `compose.foundation` accessors, which 1.11.1 deprecates in favour of exactly this ("Specify
# dependency directly"). It also removes the whole class of mismatch that material3 fell into: an
# accessor carries a version of its own, and which one it carries is not visible from the build file.
compose-runtime = { module = "org.jetbrains.compose.runtime:runtime", version.ref = "composeMultiplatform" }
compose-ui = { module = "org.jetbrains.compose.ui:ui", version.ref = "composeMultiplatform" }
compose-foundation = { module = "org.jetbrains.compose.foundation:foundation", version.ref = "composeMultiplatform" }
compose-uiTest = { module = "org.jetbrains.compose.ui:ui-test", version.ref = "composeMultiplatform" }

# A QR ENCODER and not a QR widget, which is the whole reason it is this one. It answers a matrix of
# dark and light modules; the drawing is ours, so the code comes out in the design system's colours
# and shapes instead of a library's idea of them. Published for jvm, android and the three iOS
# targets, so it survives the client growing. Read from repo1.maven.org on 2026-08-25.
qrcode = { module = "io.github.g0dkar:qrcode-kotlin", version.ref = "qrcode" }
# Named by coordinate rather than taken from the plugin's `compose.material3` accessor, because that
# accessor is pinned to a version of its own and loses to whatever the toolkit asks for — which is
# how foundation 1.12.0 came to sit beside material3 1.11.0-alpha07 and throw at render time.
compose-material3 = { module = "org.jetbrains.compose.material3:material3", version.ref = "composeMaterial3" }

# The screenshot tester. `viddik-annotations` and `viddik-testing-core` are added by its Gradle
# plugin, so these entries exist only for the day a module opts out of that with
