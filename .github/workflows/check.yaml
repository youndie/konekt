
name: check

# **No path filters.** A filter saves seconds and buys red default branches. Two changes that are
# each harmless alone disagree once merged; a generated index diverges from its sources when
# something outside the listed paths moves; and a document at the root of the tree is exactly the
# one nobody remembers to add to the list, so the check that would have caught it never runs.
# Sixty documents are checked in seconds. There is nothing here worth economising on.
on:
  push:
  pull_request:
  schedule:
    - cron: "0 6 * * 1"          # Monday morning, for the anchors job below
  workflow_dispatch:

jobs:
  # The gate. Exactly the target a contributor runs: a local check set that differs from the CI one
  # turns "green here, red there" into the normal state of affairs, and then neither is read.
  check:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      # FULL HISTORY, because `scripts/chart_version.py` asks when the chart's version last moved
      # and walks the commits that touched `Chart.yaml` to find out. The default shallow clone has
      # none of them, and the script refuses to answer rather than passing — a check that cannot see
      # its input must say so. Everything else in this job reads the tree and is indifferent.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - run: pip install pyyaml

      # BEFORE `make check`, and that order is the whole value of this step. Both checks catch a
      # number taken twice, but this one says *which branch took it and under what name*, while the
      # gate says `duplicate ids: B-06`. A failing step stops the job, so whichever runs first is
      # the message the author gets.
      #
      # Pull requests only, and only when the backlog is a file per item. Read the note below
      # before deciding whether you need it at all.
      #
      # The refspec is explicit on purpose: `git fetch origin main` moves FETCH_HEAD and creates no
      # remote-tracking ref, so the next line would fail with "could not read origin/main". The
      # check reads a tree rather than a history, so the shallow clone checkout makes is enough and
      # `fetch-depth: 0` is not needed.
      - if: github.event_name == 'pull_request'
        run: |
          git fetch --no-tags origin \
            "+refs/heads/$GITHUB_BASE_REF:refs/remotes/origin/$GITHUB_BASE_REF"
          python3 scripts/backlog_index.py --against "origin/$GITHUB_BASE_REF"

      # WHEN THE STEP ABOVE IS WORTH HAVING. It pays for itself only if the generated index is not
      # committed from the branch — for instance when the default branch rebuilds and commits it
      # itself. If every branch commits the regenerated `backlog.md`, then two branches that each
      # add an item always conflict in that one file, and two things follow, both observed:
      #
      #   * a pull request that cannot be merged gets no `pull_request` run at all, so this step
      #     does not run precisely when the branches have diverged most;
      #   * once the conflict is resolved, the ordinary duplicate-id check inside `make check`
      #     catches the collision anyway.
      #
      # So with a branch-committed index the conflict is the real guard and this step is a
      # backstop. Keep it — it is cheap and it explains itself better — but do not rely on it as
      # the only thing standing between two branches and one number.

      - run: make check

      # Default branch only. `status: draft` is legal in a pull request, where it means "this
      # branch will make it true", and a defect the moment it merges.
      - if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: python3 scripts/docs_check.py --on-main

  # The BUILD, and it is a separate job from the documentation gate on purpose: the two fail for
  # unrelated reasons and a contributor who broke a link should not be reading a Gradle log.
  #
  # `ubuntu-latest` because this repository is PUBLIC, and GitHub-hosted runners are free for public
  # repositories. A private one needs a self-hosted label here, and the difference is a bill rather
  # than a setting.
  build:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Java and Gradle in one step and at one version for the portfolio. Java 25 is mandatory
      # rather than chosen: kompot and petich publish variants tagged `org.gradle.jvm.version = 25`,
      # and Gradle refuses to build a module on anything lower against them — with a message that
      # names the dependency, not the rule. The shared action installs 21 and 25 and leaves 25 the
      # default.
      - uses: youndie/sborka/.github/actions/setup-kotlin@main

      # DECLARED RATHER THAN DISCOVERED. Half the test suite runs against a real Postgres 18 in a
      # Testcontainer — not H2, because the defects those tests exist for live in the SQL — and a
      # runner without a working Docker daemon fails somewhere inside Testcontainers with a message
      # about a socket. Asking here costs a second and names the actual requirement.
      - name: Docker is required by the container-backed tests
        run: |
          docker info > /dev/null 2>&1 || {
            echo "::error::this job runs Testcontainers and needs a working Docker daemon"
            exit 1
          }

      # THE CONFORMANCE GATE, and it is a step of its own rather than a line inside the Gradle log
      # below. It runs on every pull request and on every push to the default branch, because this
      # job does — `on:` above carries no branch filter, deliberately.
      #
      # WHAT IT ASSERTS IS COVERAGE, and it asserts it before anything reads a verdict. A
      # conformance run that finds nothing to check passes silently: `check(report.isClean)` is what
      # the kit's readme shows and what everybody writes, and it is green on a server whose screens
      # the walk never reached. So the assertion is per check and per endpoint, never a sum — a
      # total is satisfied by the checks that walk every screen while the rest see nothing at all.
      # B-24; the sibling disease and the sibling gate are B-09.
      - name: The conformance gate asserts coverage, before any verdict
        run: ./gradlew :server:test --tests 'io.konekt.conformance.*' --no-daemon

      # THE CHART'S OWN GUARDS, which nothing ran until `B-91`. They are `fail` directives in the
      # template — a missing password, a missing image version, a missing hostname, the simulator
      # above one replica, any replica count above one — and each of them used to fire for the first
      # time in front of whoever was deploying. helm is preinstalled on this runner.
      - name: The chart refuses what it says it refuses
        run: make chart

      # THE ANDROID PLATFORM IS NAMED RATHER THAN INHERITED. A runner image carries whatever platforms
      # it carries, and a build that compiles against "whatever was there" changes behaviour when the
      # image is bumped — silently, because a newer platform compiles the same sources. The two numbers
      # here are the two in `gradle/libs.versions.toml`, and `sdkmanager` is a no-op when they are
      # already installed.
      - name: The Android platform this build compiles against
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"

      # NO iOS TESTS ARE CLAIMED HERE, and saying so is one of B-37's acceptance criteria.
      #
      # On Linux, Kotlin/Native cross-compiles the Apple klibs and the simulator test tasks are
      # SKIPPED inside a green `BUILD SUCCESSFUL`. Gradle warns, and the advice attached to that
      # warning is a setting that silences it. So a green run of this job means the Apple code
      # COMPILES and nothing more; running the tests needs a Mac with a simulator runtime installed,
      # and no runner here has one.
      # `build` NOW PRODUCES AN APK TOO. `:androidApp:assemble` is part of it, so a green run of this
      # job means the Android application links — and `testAndroidHostTest` means every `commonTest`
      # ran on that target rather than merely compiling for it. Unlike Apple, nothing here is skipped.
      - name: Build and test (Apple targets are compiled, not tested; Android is both)
        run: ./gradlew build --no-daemon

  # THE STAND, and it is a job of its own because it fails for reasons the other two cannot see: a
  # container that did not come up, an image built from a distribution nobody rebuilt, a binding
  # nothing supplies. Four of those were found the first time this ran, and every one of them left
  # the unit suite green.
  #
  # The same command a person runs — `make stand-up && make e2e` — because a stand only CI knows how
  # to start is a stand nobody debugs.
  e2e:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: youndie/sborka/.github/actions/setup-kotlin@main

      # Declared rather than discovered, like the build job: this one runs five containers.
      - name: Docker is required by the stand
        run: |
          docker info > /dev/null 2>&1 || {
            echo "::error::this job brings up a docker compose stand and needs a working Docker daemon"
            exit 1
          }

      - name: Bring the stand up
        run: make stand-up

      - name: Drive it
        run: make e2e

      # The logs of a stand that failed are the only thing that explains it, and a job that ends
      # without them sends somebody to reproduce it locally. `always()` because the useful case is
      # precisely the failing one.
      - name: The stand's logs
        if: always()
        run: make stand-logs

      - name: Take it down
        if: always()
        run: make stand-down

  # Separate from the gate, and on a schedule rather than on a pull request, because an anchor rots
  # when somebody refactors a **different** repository. A pull request here is the least likely
  # moment for one to break, and running it there trains people to ignore a red build they did not
  # cause. It also does not block: a path quoted *as obsolete* is indistinguishable from a live one
  # by machine, so the report is read by a person. Add `--check` once the stale list reaches zero.
  anchors:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - run: pip install pyyaml

      # The code lives in this checkout, so its parent is a directory whose one subdirectory is
      # this repository — which is exactly what --repos expects.
      - run: python3 scripts/code_anchors.py --repos ..

      # For a separate documentation repository, replace the step above with shallow clones of the
      # services. History is not needed — only the file tree — and a repository that cannot be
      # cloned is a warning rather than a failure, because its anchors are simply unchecked.
      #
      # `secrets.GITHUB_TOKEN` is scoped to the repository running the workflow. That is enough for
      # public services, which is how the block below was tested; a private one needs a token that
      # can read it, and with the default one it will take the warning branch every week without
      # ever saying why.
      #
      #   - run: |
      #       mkdir -p repos && cd repos
      #       for r in service-one service-two; do
      #         git clone --depth 1 --filter=blob:none --no-checkout \
      #           "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository_owner }}/$r.git" \
      #           || echo "::warning::$r is unreachable - its anchors were not checked"
      #       done
      #     env:
      #       GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      #   - run: python3 scripts/code_anchors.py --repos repos
